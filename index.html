<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cluckin' Bell : gestion</title>
  <script>
    // Thème appliqué avant le rendu : pas de flash blanc.
    (function () {
      try {
        var t = localStorage.getItem('cb-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">CLUCKIN' BELL</span>
    <span class="spacer"></span>
    <label style="margin:0;color:var(--white);display:flex;gap:6px;align-items:center">
      Employé
      <input id="staff" style="width:160px;min-height:36px;padding:6px" value="Direction">
    </label>
    <button class="btn ghost" id="theme" style="color:var(--white);border-color:#444">Thème</button>
  </header>

  <div class="layout">
    <nav class="nav" id="nav">
      <button data-view="dashboard" class="active">Tableau de bord</button>
      <button data-view="caisse">Caisse</button>
      <button data-view="cuisine">Cuisine</button>
      <button data-view="commandes">Commandes</button>
      <button data-view="catalogue">Catalogue</button>
      <button data-view="stock">Stock</button>
      <button data-view="compta">Comptabilité</button>
      <button data-view="parametres">Paramètres</button>
    </nav>
    <main class="main" id="view"></main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
